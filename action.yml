name: 'Setup Takumi Guard npm Registry'
description: 'Authenticate to the Takumi byGMO Guard npm registry via OIDC. Works with npm, pnpm, yarn, and bun.'
author: 'GMO Flatt Security Inc.'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  bot-id:
    description: 'Bot ID from Shisho Cloud byGMO console. Omit for anonymous mode (Tier A blocking only).'
    required: false
    default: ''
  sts-url:
    description: 'STS service URL'
    required: false
    default: 'https://sts.cloud.shisho.dev'
  registry-url:
    description: 'npm registry URL'
    required: false
    default: 'https://npm.flatt.tech'
  expires-in:
    description: 'Token expiration in seconds (max 86400)'
    required: false
    default: '1800'
  set-registry:
    description: 'Set the registry URL. Set to false if you manage the registry yourself.'
    required: false
    default: 'true'
  always-auth:
    description: 'Also send the token for unscoped packages with Yarn Classic. npm 11 and later warn about this setting on every command.'
    required: false
    default: 'false'
  audience:
    description: 'Audience for the OIDC token request. Defaults to the STS URL. Override when your Bot trust condition expects a different value.'
    required: false
    default: ''

outputs:
  registry-url:
    description: 'The npm registry URL'
    value: ${{ steps.set-outputs.outputs.registry-url }}
  token:
    description: 'The access token for the registry (empty in anonymous mode)'
    value: ${{ steps.set-outputs.outputs.token }}
  token-expires-at:
    description: 'ISO 8601 timestamp when the token expires'
    value: ${{ steps.set-outputs.outputs.token-expires-at }}
  npmrc-path:
    description: 'Absolute path of the .npmrc this action wrote'
    value: ${{ steps.set-outputs.outputs.npmrc-path }}

runs:
  using: 'composite'
  steps:
    - name: Configure registry
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        SET_REGISTRY: ${{ inputs.set-registry }}
      run: |
        # Write the configuration to a file outside the checkout that applies to
        # installs in every directory, and pass its location to later steps. The
        # file holds the token, so it is readable by the owner only.
        umask 077

        # Keep settings the job already relies on.
        if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
          # Another step (for example actions/setup-node with registry-url) already
          # chose the configuration file, so add to it.
          NPMRC="${NPM_CONFIG_USERCONFIG}"
          mkdir -p "$(dirname "$NPMRC")"
          echo "::notice::Adding Takumi Guard settings to ${NPMRC}, which is already in use"
        else
          NPMRC="${RUNNER_TEMP}/.npmrc"
          if [ ! -f "$NPMRC" ] && [ -f "${HOME}/.npmrc" ]; then
            # Start from the contents of $HOME/.npmrc so its settings keep applying.
            cp "${HOME}/.npmrc" "$NPMRC"
            chmod 600 "$NPMRC"
            echo "::notice::Seeded ${NPMRC} from ${HOME}/.npmrc so its settings keep applying"
          fi
          # Exported in every mode, including set-registry: false.
          echo "NPM_CONFIG_USERCONFIG=${NPMRC}" >> "$GITHUB_ENV"
        fi

        # Write to .npmrc directly instead of `npm config set` to avoid
        # `EBADDEVENGINES` failures when projects pin the package manager
        # via `devEngines.packageManager` (npm 10.9.0+). See issue #4.
        if [ "$SET_REGISTRY" != "false" ]; then
          if [ -f "$NPMRC" ]; then
            grep -v '^registry=' "$NPMRC" > "${NPMRC}.tmp" || true
            mv "${NPMRC}.tmp" "$NPMRC"
          fi
          echo "registry=${REGISTRY_URL}/" >> "$NPMRC"
          # The environment takes precedence over every .npmrc file, including one
          # committed to the repository. Scoped registries still apply.
          echo "NPM_CONFIG_REGISTRY=${REGISTRY_URL}/" >> "$GITHUB_ENV"
          # The same registry setting for pnpm.
          echo "pnpm_config_registry=${REGISTRY_URL}/" >> "$GITHUB_ENV"
          echo "YARN_NPM_REGISTRY_SERVER=${REGISTRY_URL}/" >> "$GITHUB_ENV"
          echo "::notice::Registry set to ${REGISTRY_URL} (configuration at ${NPMRC})"
        else
          echo "::notice::Registry left to your own configuration; credentials go to ${NPMRC}"
        fi

    - name: Authenticate
      id: auth
      shell: bash
      env:
        BOT_ID: ${{ inputs.bot-id }}
        STS_URL: ${{ inputs.sts-url }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        EXPIRES_IN: ${{ inputs.expires-in }}
        SET_REGISTRY: ${{ inputs.set-registry }}
        AUDIENCE_INPUT: ${{ inputs.audience }}
        ALWAYS_AUTH: ${{ inputs.always-auth }}
      run: |
        # The file holds the token, so it is readable by the owner only.
        umask 077

        # The configuration file chosen in the previous step.
        NPMRC="${NPM_CONFIG_USERCONFIG:-${RUNNER_TEMP}/.npmrc}"

        # Anonymous mode — no bot-id provided
        if [ -z "$BOT_ID" ]; then
          echo "::notice::No bot-id provided — running in anonymous mode (Tier A blocking)"
          exit 0
        fi

        # Get OIDC token
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          MSG="OIDC not available. Add 'permissions: { id-token: write }' to your job."
          if [ "$SET_REGISTRY" = "false" ]; then
            echo "::error::${MSG}"
            exit 1
          else
            echo "::error::${MSG} Falling back to anonymous mode (Tier A). Logging integrity is compromised."
            exit 0
          fi
        fi

        # Resolve the OIDC audience: an explicit input wins; otherwise default
        # to the STS URL. The audience names the verifier of the token, and
        # that is the STS regardless of ecosystem or GitHub flavor — it is
        # also the console's default audience for trust conditions. Normalized
        # without a trailing slash because STS matches it as an exact string.
        STS_URL_NORMALIZED=$(echo "$STS_URL" | sed 's|/$||')
        if [ -n "$AUDIENCE_INPUT" ]; then
          OIDC_AUDIENCE="$AUDIENCE_INPUT"
        else
          OIDC_AUDIENCE="$STS_URL_NORMALIZED"
        fi

        OIDC_TOKEN=$(curl -sS -f -G \
          --data-urlencode "audience=${OIDC_AUDIENCE}" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
          | jq -r '.value' 2>/dev/null) || true

        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
          MSG="Failed to get OIDC token."
          if [ "$SET_REGISTRY" = "false" ]; then
            echo "::error::${MSG} No registry fallback available."
            exit 1
          else
            echo "::error::${MSG} Falling back to anonymous mode (Tier A). Logging integrity is compromised."
            exit 0
          fi
        fi

        echo "::add-mask::${OIDC_TOKEN}"

        # Exchange for STS access token
        RESPONSE=$(curl -sS -X POST "${STS_URL}/bots/exchange" \
          -H "Content-Type: application/json" \
          -d "{\"bot_id\": \"${BOT_ID}\", \"id_token\": \"${OIDC_TOKEN}\", \"expires_in\": ${EXPIRES_IN}}" 2>/dev/null) || true

        ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token' 2>/dev/null)
        EXPIRES_IN_ACTUAL=$(echo "$RESPONSE" | jq -r '.expires_in' 2>/dev/null)

        if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // "Unknown error"' 2>/dev/null)
          MSG="Authentication failed: ${ERROR_MSG}"
          if [ "$SET_REGISTRY" = "false" ]; then
            echo "::error::${MSG} No registry fallback available."
            exit 1
          else
            echo "::error::${MSG} Falling back to anonymous mode (Tier A). Logging integrity is compromised."
            exit 0
          fi
        fi

        echo "::add-mask::${ACCESS_TOKEN}"

        REGISTRY_HOST=$(echo "$REGISTRY_URL" | sed 's|^https://||' | sed 's|/$||')
        # Write to .npmrc directly instead of `npm config set` to avoid
        # `EBADDEVENGINES` failures when projects pin the package manager
        # via `devEngines.packageManager` (npm 10.9.0+). See issue #4.
        if [ -f "$NPMRC" ]; then
          grep -v "^//${REGISTRY_HOST}/:_authToken=" "$NPMRC" > "${NPMRC}.tmp" || true
          mv "${NPMRC}.tmp" "$NPMRC"
        fi
        echo "//${REGISTRY_HOST}/:_authToken=${ACCESS_TOKEN}" >> "$NPMRC"

        # always-auth input: Yarn Classic also sends the token for unscoped
        # packages. The entry names the registry host only.
        if [ "$ALWAYS_AUTH" = "true" ]; then
          grep -v "^//${REGISTRY_HOST}/:always-auth=" "$NPMRC" > "${NPMRC}.tmp" || true
          mv "${NPMRC}.tmp" "$NPMRC"
          echo "//${REGISTRY_HOST}/:always-auth=true" >> "$NPMRC"
        fi

        # Yarn Berry and bun take the token from these variables.
        echo "YARN_NPM_AUTH_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"
        echo "BUN_CONFIG_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

        # Yarn Berry also sends the token for unscoped packages.
        echo "YARN_NPM_ALWAYS_AUTH=true" >> "$GITHUB_ENV"

        echo "token=${ACCESS_TOKEN}" >> "$GITHUB_OUTPUT"

        # Calculate expiration timestamp (Linux date -d, macOS date -v fallback)
        EXPIRES_AT=$(date -u -d "+${EXPIRES_IN_ACTUAL} seconds" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                     date -u -v+"${EXPIRES_IN_ACTUAL}"S +%Y-%m-%dT%H:%M:%SZ)
        echo "expires_at=${EXPIRES_AT}" >> "$GITHUB_OUTPUT"

        echo "::notice::Authenticated as bot ${BOT_ID} (Tier C)"

    - name: Set outputs
      id: set-outputs
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        EXPIRES_AT: ${{ steps.auth.outputs.expires_at }}
      run: |
        echo "registry-url=${REGISTRY_URL}" >> "$GITHUB_OUTPUT"
        echo "npmrc-path=${NPM_CONFIG_USERCONFIG:-${RUNNER_TEMP}/.npmrc}" >> "$GITHUB_OUTPUT"
        if [ -n "$ACCESS_TOKEN" ]; then
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "token=${ACCESS_TOKEN}" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$EXPIRES_AT" ]; then
          echo "token-expires-at=${EXPIRES_AT}" >> "$GITHUB_OUTPUT"
        fi
