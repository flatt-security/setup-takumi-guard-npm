name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          echo "action.yml is valid YAML"

      - name: Check required fields
        run: |
          grep -q 'using:.*composite' action.yml
          grep -q "bot-id:" action.yml
          echo "Required fields present"

  behaviour:
    name: npm, ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: install in a subdirectory
            dir: infrastructure
          - name: install at the repository root
            dir: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fixture
        run: |
          mkdir -p infrastructure
          echo '{ "name": "root", "private": true, "version": "1.0.0" }' > package.json
          echo '{ "name": "infra", "version": "1.0.0" }' > infrastructure/package.json

      - uses: ./

      - name: The checkout stays clean and the file is private
        run: |
          test -f "${RUNNER_TEMP}/.npmrc" || { echo "::error::no configuration was written"; exit 1; }
          MODE=$(stat -c '%a' "${RUNNER_TEMP}/.npmrc")
          [ "$MODE" = "600" ] || { echo "::error::permissions are ${MODE}, expected 600"; exit 1; }
          if [ -f .npmrc ]; then echo "::error::the workspace root was written to"; exit 1; fi
          [ "$NPM_CONFIG_USERCONFIG" = "${RUNNER_TEMP}/.npmrc" ] || { echo "::error::NPM_CONFIG_USERCONFIG is ${NPM_CONFIG_USERCONFIG}"; exit 1; }
          [ "$NPM_CONFIG_REGISTRY" = "https://npm.flatt.tech/" ] || { echo "::error::NPM_CONFIG_REGISTRY is ${NPM_CONFIG_REGISTRY}"; exit 1; }

      # With NPM_CONFIG_REGISTRY removed, only the file can name the proxy.
      - name: The file itself is what npm reads from ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: |
          ACTUAL=$(env -u NPM_CONFIG_REGISTRY npm config get registry)
          echo "without NPM_CONFIG_REGISTRY, npm resolves -> ${ACTUAL}"
          [ "$ACTUAL" = "https://npm.flatt.tech/" ] || { echo "::error::the configuration file is not being read"; exit 1; }

      # The public registry serves the same package, so check where npm fetched it from.
      - name: The install reaches the proxy from ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: |
          npm install --no-package-lock --prefer-online --loglevel=http \
            --cache "${RUNNER_TEMP}/npm-cache-${{ strategy.job-index }}" left-pad@1.3.0 2>&1 | tee log.txt >/dev/null
          grep -E 'npm http fetch' log.txt
          grep -q 'https://npm.flatt.tech/left-pad' log.txt || { echo "::error::the metadata did not come from the proxy"; exit 1; }

  workspaces:
    name: npm workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fixture
        run: |
          mkdir -p fixture-ws/packages/a
          echo '{ "name": "root", "private": true, "workspaces": ["packages/*"] }' > fixture-ws/package.json
          echo '{ "name": "a", "version": "1.0.0" }' > fixture-ws/packages/a/package.json

      - uses: ./

      # Inside a workspace package, the URL npm fetched from is the evidence.
      - name: An install in a workspace package reaches the proxy
        working-directory: fixture-ws
        run: |
          npm install --workspace ./packages/a --package-lock-only --prefer-online \
            --loglevel=http --cache "${RUNNER_TEMP}/npm-cache-ws" left-pad@1.3.0 2>&1 | tee log.txt >/dev/null
          grep -q 'https://npm.flatt.tech/left-pad' log.txt || { echo "::error::the metadata did not come from the proxy"; exit 1; }

  other-clients:
    name: ${{ matrix.client }} in a subdirectory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [pnpm, 'yarn-classic']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: matrix.client == 'pnpm'
        with:
          version: 10

      - name: Fixture
        run: |
          mkdir -p infrastructure
          echo '{ "name": "infra", "version": "1.0.0", "license": "MIT" }' > infrastructure/package.json

      - uses: ./

      # With NPM_CONFIG_REGISTRY removed, only the file can name the proxy. Yarn Classic
      # is judged on the URL it requests, since yarn config get registry does not report it.
      - name: The file itself is what ${{ matrix.client }} reads
        working-directory: infrastructure
        run: |
          if [ "${{ matrix.client }}" = "pnpm" ]; then
            ACTUAL=$(env -u NPM_CONFIG_REGISTRY pnpm config get registry)
            echo "without NPM_CONFIG_REGISTRY, pnpm resolves -> ${ACTUAL}"
            case "$ACTUAL" in
              https://npm.flatt.tech/*) ;;
              *) echo "::error::pnpm did not read the configuration file (${ACTUAL})"; exit 1 ;;
            esac
          else
            env -u NPM_CONFIG_REGISTRY npx --yes yarn@1.22.22 add left-pad@1.3.0 --verbose 2>&1 | tee file-only.log >/dev/null
            grep -q 'Performing "GET" request to "https://npm.flatt.tech/left-pad"' file-only.log \
              || { echo "::error::without the environment, Yarn Classic did not reach the proxy, so the file is not being read"; grep -oE 'request to "[^"]+"' file-only.log | head -5; exit 1; }
            echo "without NPM_CONFIG_REGISTRY, Yarn Classic still fetched from the proxy"
            rm -rf node_modules yarn.lock
          fi

      # pnpm does not print the URLs it fetches, so the check above is its evidence.
      - name: The install reaches the proxy
        working-directory: infrastructure
        run: |
          if [ "${{ matrix.client }}" = "pnpm" ]; then
            pnpm add --store-dir "${RUNNER_TEMP}/pnpm-store" left-pad@1.3.0 2>&1 | tail -3
            test -d node_modules/left-pad || { echo "::error::pnpm did not install the package"; exit 1; }
          else
            npx --yes yarn@1.22.22 add left-pad@1.3.0 --verbose 2>&1 | tee log.txt | tail -3
            grep -q 'Performing "GET" request to "https://npm.flatt.tech/left-pad"' log.txt \
              || { echo "::error::the fetch did not go through the proxy"; grep -oE 'request to "[^"]+"' log.txt | head -5; exit 1; }
          fi

  authenticated-clients:
    name: authenticated mode delivers the token (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.14', 'latest']
    # No id-token permission, so the action calls the stand-in OIDC endpoint below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Installed before the action, so fetching the tools does not use the fake token.
      - name: Fixture
        run: |
          mkdir -p infrastructure/npm infrastructure/bun infrastructure/berry infrastructure/berry-unscoped infrastructure/classic
          echo '{ "name": "npm-fixture", "version": "1.0.0" }' > infrastructure/npm/package.json
          echo '{ "name": "classic-fixture", "version": "1.0.0", "packageManager": "yarn@1.22.22" }' > infrastructure/classic/package.json
          echo '{ "name": "bun-fixture", "version": "1.0.0" }' > infrastructure/bun/package.json
          echo '{ "name": "berry-fixture", "version": "1.0.0", "packageManager": "yarn@4.18.0" }' > infrastructure/berry/package.json
          printf 'nodeLinker: node-modules\nenableTelemetry: false\n' > infrastructure/berry/.yarnrc.yml
          touch infrastructure/berry/yarn.lock
          # A separate project, so the 401 in the unscoped step comes from that package.
          cp infrastructure/berry/package.json infrastructure/berry/.yarnrc.yml infrastructure/berry/yarn.lock infrastructure/berry-unscoped/
          corepack enable
          (cd infrastructure/berry && yarn --version)
          (cd infrastructure/classic && yarn --version)

      # Stand-in OIDC and STS endpoints issue a fake token; the real proxy rejects it with 401.
      - name: Stand-in OIDC and STS endpoints
        run: |
          nohup python3 .github/test/standin.py >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && break; sleep 0.5; done

      - uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:18080/oidc
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: unused
        with:
          bot-id: standin-bot
          sts-url: http://127.0.0.1:18080
          always-auth: 'true'

      - name: The token is exported for the clients that do not read the file
        run: |
          [ "${BUN_CONFIG_TOKEN:-}" = "standin-guard-token" ] || { echo "::error::BUN_CONFIG_TOKEN is not the issued token"; exit 1; }
          [ "${YARN_NPM_AUTH_TOKEN:-}" = "standin-guard-token" ] || { echo "::error::YARN_NPM_AUTH_TOKEN is not the issued token"; exit 1; }
          [ "${YARN_NPM_ALWAYS_AUTH:-}" = "true" ] || { echo "::error::YARN_NPM_ALWAYS_AUTH is not set, so Yarn Berry sends no token for unscoped packages"; exit 1; }
          grep -qx '//npm.flatt.tech/:_authToken=standin-guard-token' "$NPM_CONFIG_USERCONFIG" || { echo "::error::the token is not in the configuration file"; exit 1; }
          grep -qx '//npm.flatt.tech/:always-auth=true' "$NPM_CONFIG_USERCONFIG" || { echo "::error::always-auth was requested but not written"; exit 1; }
          [ -z "${NPM_CONFIG_TOKEN:-}" ] || { echo "::error::NPM_CONFIG_TOKEN is set"; exit 1; }

      # A 401 from the proxy shows the token was sent; without a token the proxy answers 200.
      - name: npm sends the token to the proxy from a subdirectory
        working-directory: infrastructure/npm
        run: |
          npm install --no-package-lock --prefer-online --loglevel=http \
            --cache "${RUNNER_TEMP}/npm-cache-auth" left-pad@1.3.0 > log.txt 2>&1 && { echo "::error::npm installed anonymously, so the token was not sent"; exit 1; }
          grep -E 'npm.flatt.tech/left-pad|E401' log.txt | head -5
          grep -q 'E401' log.txt || { echo "::error::npm failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }

      - name: bun sends the token to the proxy from a subdirectory
        working-directory: infrastructure/bun
        run: |
          bun add left-pad@1.3.0 --no-cache --verbose > log.txt 2>&1 && { echo "::error::bun installed anonymously, so the token was not sent"; exit 1; }
          grep -E 'GET https://npm.flatt.tech/|^< 401' log.txt | head -5
          grep -q '^< 401' log.txt || { echo "::error::bun failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }

      # Needs the always-auth input set above.
      - name: Yarn Classic sends the token for unscoped packages under always-auth
        working-directory: infrastructure/classic
        run: |
          yarn add left-pad@1.3.0 --verbose > log.txt 2>&1 && { echo "::error::Yarn Classic installed an unscoped package anonymously, so always-auth had no effect"; exit 1; }
          grep -q 'status code 401' log.txt || { echo "::error::Yarn Classic failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }
          grep -oE 'Request "[^"]+" finished with status code 401' log.txt | head -1

      # A scoped package.
      - name: Yarn Berry sends the token to the proxy from a subdirectory
        working-directory: infrastructure/berry
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          yarn add @types/left-pad@1.2.0 > log.txt 2>&1 && { echo "::error::Yarn Berry installed anonymously, so the token was not sent"; exit 1; }
          grep -q 'YN0041' log.txt || { echo "::error::Yarn Berry failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }
          grep 'YN0041' log.txt | head -3

      # An unscoped package.
      - name: Yarn Berry sends the token for unscoped packages too
        working-directory: infrastructure/berry-unscoped
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          yarn add left-pad@1.3.0 > log.txt 2>&1 && { echo "::error::Yarn Berry installed an unscoped package anonymously, so the token was not sent"; exit 1; }
          grep -q 'YN0041' log.txt || { echo "::error::Yarn Berry failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }
          grep 'YN0041' log.txt | head -3

  authenticated-auth-only:
    name: set-registry false still attributes bun and Yarn Berry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2

      # The project's own configuration names the proxy, as set-registry: false requires.
      - name: Fixture
        run: |
          mkdir -p berry-own-config
          echo '{ "name": "berry-own-config", "version": "1.0.0", "packageManager": "yarn@4.18.0" }' > berry-own-config/package.json
          printf 'nodeLinker: node-modules\nenableTelemetry: false\nnpmRegistryServer: "https://npm.flatt.tech"\n' > berry-own-config/.yarnrc.yml
          touch berry-own-config/yarn.lock
          corepack enable
          (cd berry-own-config && yarn --version)

      - name: Stand-in OIDC and STS endpoints
        run: |
          nohup python3 .github/test/standin.py >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && break; sleep 0.5; done

      - uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:18080/oidc
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: unused
        with:
          bot-id: standin-bot
          sts-url: http://127.0.0.1:18080
          set-registry: 'false'

      - name: The token is exported together with npmAlwaysAuth
        run: |
          [ "${YARN_NPM_AUTH_TOKEN:-}" = "standin-guard-token" ] || { echo "::error::YARN_NPM_AUTH_TOKEN is not the issued token, so this job proves nothing"; exit 1; }
          [ "${YARN_NPM_ALWAYS_AUTH:-}" = "true" ] || { echo "::error::YARN_NPM_ALWAYS_AUTH is not set, so Yarn Berry sends no token for unscoped packages"; exit 1; }
          [ "${BUN_CONFIG_TOKEN:-}" = "standin-guard-token" ] || { echo "::error::BUN_CONFIG_TOKEN is not the issued token"; exit 1; }
          [ -z "${NPM_CONFIG_REGISTRY:-}" ] || { echo "::error::NPM_CONFIG_REGISTRY was set even though set-registry is false"; exit 1; }

      # An unscoped package.
      - name: Yarn Berry still sends the token to the proxy the caller configured
        working-directory: berry-own-config
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          yarn add left-pad@1.3.0 > log.txt 2>&1 && { echo "::error::Yarn Berry installed an unscoped package anonymously, so the token was not sent"; exit 1; }
          grep -q 'YN0041' log.txt || { echo "::error::Yarn Berry failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }
          grep 'YN0041' log.txt | head -3

      # The project's own .npmrc names the proxy; the token comes from the action.
      - name: bun still sends the token to the proxy the caller configured
        run: |
          mkdir -p bun-own-config
          echo '{ "name": "bun-own-config", "version": "1.0.0" }' > bun-own-config/package.json
          echo 'registry=https://npm.flatt.tech/' > bun-own-config/.npmrc
          cd bun-own-config
          bun add left-pad@1.3.0 --no-cache --verbose > log.txt 2>&1 && { echo "::error::bun installed anonymously, so the token was not sent"; exit 1; }
          grep -q '^< 401' log.txt || { echo "::error::bun failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }

  auth-only-mode:
    name: set-registry false still delivers the file location
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The registry is the caller's here; the action must still say where the credentials are.
      - uses: ./
        with:
          set-registry: 'false'

      - name: The file location is exported and the registry is left alone
        run: |
          [ -n "${NPM_CONFIG_USERCONFIG:-}" ] || { echo "::error::NPM_CONFIG_USERCONFIG was not exported, so credentials would be written where nothing reads them"; exit 1; }
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG}"
          [ -z "${NPM_CONFIG_REGISTRY:-}" ] || { echo "::error::NPM_CONFIG_REGISTRY was set even though set-registry is false"; exit 1; }

  seeds-from-home:
    name: the existing $HOME/.npmrc keeps applying
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A setting in $HOME/.npmrc must keep applying.
      - name: A user-level setting that must survive
        run: printf '@probe:registry=https://probe.example/\n' > "${HOME}/.npmrc"

      - uses: ./

      - name: The setting survived and the original file was not touched
        run: |
          grep -q '^@probe:registry=https://probe.example/$' "$NPM_CONFIG_USERCONFIG" \
            || { echo "::error::the scoped registry from \$HOME/.npmrc was dropped"; cat "$NPM_CONFIG_USERCONFIG"; exit 1; }
          ACTUAL=$(npm config get @probe:registry)
          [ "$ACTUAL" = "https://probe.example/" ] || { echo "::error::npm no longer resolves the scoped registry (${ACTUAL})"; exit 1; }
          grep -q 'npm.flatt.tech' "${HOME}/.npmrc" && { echo "::error::\$HOME/.npmrc was modified"; exit 1; }
          echo "the seed survived and \$HOME/.npmrc is unchanged"

  respects-an-existing-userconfig:
    name: writes into the file another action owns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A path other than the action's default, so the check cannot pass by accident.
      - name: Another step already owns the user configuration
        run: |
          mkdir -p "${RUNNER_TEMP}/other"
          printf '@owned:registry=https://owned.example/\n' > "${RUNNER_TEMP}/other/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/other/.npmrc" >> "$GITHUB_ENV"

      - id: guard
        uses: ./

      - name: The settings landed in that file, and the variable did not move
        env:
          REPORTED_PATH: ${{ steps.guard.outputs.npmrc-path }}
        run: |
          [ "${NPM_CONFIG_USERCONFIG}" = "${RUNNER_TEMP}/other/.npmrc" ] || { echo "::error::NPM_CONFIG_USERCONFIG moved to ${NPM_CONFIG_USERCONFIG}"; exit 1; }
          [ "$REPORTED_PATH" = "${RUNNER_TEMP}/other/.npmrc" ] || { echo "::error::the npmrc-path output says ${REPORTED_PATH}"; exit 1; }
          grep -q '^registry=https://npm.flatt.tech/' "${RUNNER_TEMP}/other/.npmrc" || { echo "::error::the proxy registry was not written to the file in use"; cat "${RUNNER_TEMP}/other/.npmrc"; exit 1; }
          grep -q '^@owned:registry=https://owned.example/$' "${RUNNER_TEMP}/other/.npmrc" || { echo "::error::the existing entry was dropped"; exit 1; }
          if [ -f "${RUNNER_TEMP}/.npmrc" ]; then
            echo "::error::the action wrote its default path instead of the file already in use"; exit 1
          fi

  setup-node-coexistence:
    name: ${{ matrix.order }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        order: ['setup-node first', 'setup-node last']
    steps:
      - uses: actions/checkout@v4

      - name: Stand-in OIDC and STS endpoints
        run: |
          nohup python3 .github/test/standin.py >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && break; sleep 0.5; done

      # actions/setup-node rewrites the same file; the proxy must stay in effect in either order.
      - uses: actions/setup-node@v4
        if: matrix.order == 'setup-node first'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:18080/oidc
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: unused
        with:
          bot-id: standin-bot
          sts-url: http://127.0.0.1:18080

      - uses: actions/setup-node@v4
        if: matrix.order == 'setup-node last'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: The proxy is still the effective registry
        run: |
          sed 's/:_authToken=.*/:_authToken=REDACTED/' "${RUNNER_TEMP}/.npmrc"
          ACTUAL=$(npm config get registry)
          echo "npm config get registry -> ${ACTUAL}"
          [ "$ACTUAL" = "https://npm.flatt.tech/" ] || { echo "::error::the proxy is not in effect"; exit 1; }

      # The 401 shows the token line survived setup-node rewriting the file.
      - name: The token still reaches the proxy
        run: |
          mkdir -p probe && cd probe && echo '{ "name": "probe", "version": "1.0.0" }' > package.json
          npm install --no-package-lock --prefer-online --cache "${RUNNER_TEMP}/npm-cache-order" left-pad@1.3.0 > log.txt 2>&1 && { echo "::error::npm installed anonymously, so the token was lost"; exit 1; }
          grep -q 'E401' log.txt || { echo "::error::npm failed for a reason other than the proxy rejecting the token"; tail -20 log.txt; exit 1; }

  project-npmrc:
    name: a committed project .npmrc does not take ${{ matrix.client }} off the proxy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [npm, 'pnpm 10', 'pnpm 11', yarn-classic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: startsWith(matrix.client, 'pnpm')
        with:
          version: ${{ matrix.client == 'pnpm 10' && 10 || 11 }}

      # Committed, so git status shows whether the action changed a tracked .npmrc.
      - name: Fixture
        run: |
          mkdir -p infrastructure
          echo '{ "name": "infra", "version": "1.0.0", "license": "MIT" }' > infrastructure/package.json
          echo 'registry=https://registry.npmjs.org/' > infrastructure/.npmrc
          echo 'engine-strict=false' > .npmrc
          git add -f .npmrc infrastructure
          git -c user.name=test -c user.email=test@example.com commit -qm fixture

      - uses: ./

      - name: The checkout stays clean
        run: |
          [ -z "$(git status --porcelain)" ] || { echo "::error::the checkout was modified"; git status --porcelain; exit 1; }

      - name: The install reaches the proxy
        working-directory: infrastructure
        run: |
          case "${{ matrix.client }}" in
            npm)
              npm install --no-package-lock --prefer-online --loglevel=http \
                --cache "${RUNNER_TEMP}/npm-cache-pinned" left-pad@1.3.0 2>&1 | tee log.txt >/dev/null
              grep -q 'https://npm.flatt.tech/left-pad' log.txt || { echo "::error::the metadata did not come from the proxy"; grep 'npm http fetch' log.txt; exit 1; } ;;
            pnpm*)
              ACTUAL=$(pnpm config get registry)
              echo "pnpm resolves -> ${ACTUAL}"
              case "$ACTUAL" in
                https://npm.flatt.tech/*) ;;
                *) echo "::error::the committed .npmrc took pnpm off the proxy"; exit 1 ;;
              esac ;;
            yarn-classic)
              npx --yes yarn@1.22.22 add left-pad@1.3.0 --verbose 2>&1 | tee log.txt >/dev/null
              grep -q 'Performing "GET" request to "https://npm.flatt.tech/left-pad"' log.txt \
                || { echo "::error::the fetch did not go through the proxy"; grep -oE 'request to "[^"]+"' log.txt | head -5; exit 1; } ;;
          esac

  dockerfile-secret:
    name: the configuration works as a docker build secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./

      - name: Build with the configuration mounted as a secret
        run: |
          mkdir -p docker-fixture
          cat > docker-fixture/Dockerfile <<'EOF'
          FROM node:22-alpine
          WORKDIR /app
          # --loglevel=http prints the URL npm fetched from.
          RUN --mount=type=secret,id=npmrc,target=/root/.npmrc \
              npm install --no-package-lock --loglevel=http left-pad@1.3.0
          EOF
          docker build --secret id=npmrc,src="$NPM_CONFIG_USERCONFIG" --progress=plain \
            -t guard-npmrc-secret docker-fixture 2>&1 | tee build.log
          grep -q 'https://npm.flatt.tech/left-pad' build.log || { echo "::error::the install in the container did not reach the proxy"; exit 1; }

      - name: The secret is absent from the image
        run: |
          if docker run --rm guard-npmrc-secret sh -c 'test -f /root/.npmrc'; then
            echo "::error::the secret survived into the image"; exit 1
          fi
